<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" role="img" aria-label="A block holds one hash per unit, so a request can resume at any of them" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13">
<text x="24" y="34" font-size="15" font-weight="600" fill="#f0f6fc">A block holds one hash per unit, so a request can resume at any of them</text>
<rect x="24" y="46" width="12" height="12" fill="#30363d" stroke="#6e7681" stroke-width="1"/>
<text x="42" y="56" font-size="11.5" fill="#9198a1">cached tokens</text>
<rect x="150" y="46" width="12" height="12" fill="#58a6ff" fill-opacity="0.22" stroke="#58a6ff" stroke-width="1"/>
<text x="168" y="56" font-size="11.5" fill="#9198a1">written by the new request</text>
<line x1="350" x2="350" y1="44" y2="60" stroke="#58a6ff" stroke-width="2"/>
<text x="358" y="56" font-size="11.5" fill="#9198a1">where the new request resumes</text>
<rect x="200" y="80" width="320" height="32" fill="#30363d"/>
<rect x="200" y="80" width="512" height="32" rx="4" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<line x1="264" x2="264" y1="112" y2="118" stroke="#6e7681" stroke-width="1.25"/>
<line x1="328" x2="328" y1="112" y2="118" stroke="#6e7681" stroke-width="1.25"/>
<line x1="392" x2="392" y1="112" y2="118" stroke="#6e7681" stroke-width="1.25"/>
<line x1="456" x2="456" y1="112" y2="118" stroke="#6e7681" stroke-width="1.25"/>
<line x1="520" x2="520" y1="112" y2="118" stroke="#6e7681" stroke-width="1.25"/>
<text x="24" y="94" font-size="13" font-weight="600" fill="#f0f6fc">Cached block</text>
<text x="24" y="110" font-size="11.5" fill="#9198a1">one hash per hash unit</text>
<text x="264" y="132" font-size="11.5" text-anchor="middle" fill="#f0f6fc">h1</text>
<text x="328" y="132" font-size="11.5" text-anchor="middle" fill="#f0f6fc">h2</text>
<text x="392" y="132" font-size="11.5" text-anchor="middle" fill="#f0f6fc">h3</text>
<text x="456" y="132" font-size="11.5" text-anchor="middle" fill="#f0f6fc">h4</text>
<text x="520" y="132" font-size="11.5" text-anchor="middle" fill="#f0f6fc">h5</text>
<rect x="200" y="168" width="320" height="32" fill="#30363d"/>
<rect x="520" y="168" width="192" height="32" fill="#58a6ff" fill-opacity="0.22"/>
<rect x="200" y="168" width="512" height="32" rx="4" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<line x1="264" x2="264" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="328" x2="328" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="392" x2="392" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="456" x2="456" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="520" x2="520" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="584" x2="584" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="648" x2="648" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="712" x2="712" y1="200" y2="206" stroke="#6e7681" stroke-width="1.25"/>
<line x1="520" x2="520" y1="160" y2="208" stroke="#58a6ff" stroke-width="2"/>
<text x="24" y="182" font-size="13" font-weight="600" fill="#f0f6fc">Extend</text>
<text x="24" y="198" font-size="11.5" fill="#9198a1">hit at h5, the last hash</text>
<text x="24" y="214" font-size="11.5" fill="#9198a1">same block, no copy</text>
<text x="264" y="220" font-size="11.5" text-anchor="middle" fill="#9198a1">h1</text>
<text x="328" y="220" font-size="11.5" text-anchor="middle" fill="#9198a1">h2</text>
<text x="392" y="220" font-size="11.5" text-anchor="middle" fill="#9198a1">h3</text>
<text x="456" y="220" font-size="11.5" text-anchor="middle" fill="#9198a1">h4</text>
<text x="520" y="220" font-size="11.5" text-anchor="middle" fill="#9198a1">h5</text>
<text x="584" y="220" font-size="11.5" font-weight="600" text-anchor="middle" fill="#f0f6fc">h6</text>
<text x="648" y="220" font-size="11.5" font-weight="600" text-anchor="middle" fill="#f0f6fc">h7</text>
<text x="704" y="220" font-size="11.5" font-weight="600" text-anchor="middle" fill="#f0f6fc">h8</text>
<rect x="200" y="256" width="192" height="32" fill="#30363d"/>
<rect x="392" y="256" width="128" height="32" fill="#58a6ff" fill-opacity="0.22"/>
<rect x="200" y="256" width="512" height="32" rx="4" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<line x1="264" x2="264" y1="288" y2="294" stroke="#6e7681" stroke-width="1.25"/>
<line x1="328" x2="328" y1="288" y2="294" stroke="#6e7681" stroke-width="1.25"/>
<line x1="392" x2="392" y1="288" y2="294" stroke="#6e7681" stroke-width="1.25"/>
<line x1="456" x2="456" y1="288" y2="294" stroke="#6e7681" stroke-width="1.25"/>
<line x1="520" x2="520" y1="288" y2="294" stroke="#6e7681" stroke-width="1.25"/>
<line x1="392" x2="392" y1="248" y2="296" stroke="#58a6ff" stroke-width="2"/>
<text x="24" y="270" font-size="13" font-weight="600" fill="#f0f6fc">Fork</text>
<text x="24" y="286" font-size="11.5" fill="#9198a1">hit at h3, hashes follow it</text>
<text x="24" y="302" font-size="11.5" fill="#9198a1">copy; source keeps h1-h5</text>
<text x="264" y="308" font-size="11.5" text-anchor="middle" fill="#9198a1">h1</text>
<text x="328" y="308" font-size="11.5" text-anchor="middle" fill="#9198a1">h2</text>
<text x="392" y="308" font-size="11.5" text-anchor="middle" fill="#9198a1">h3</text>
<text x="456" y="308" font-size="11.5" font-weight="600" text-anchor="middle" fill="#f0f6fc">h4′</text>
<text x="520" y="308" font-size="11.5" font-weight="600" text-anchor="middle" fill="#f0f6fc">h5′</text>
</svg>
